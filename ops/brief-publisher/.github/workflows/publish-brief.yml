# Lives in the public snapshot repository (e.g. Yilin1207/capitalive-brief), not in capitalive.
# ~7 minutes after every New York-grid H4 close: winter 22/02/06/10/14/18 UTC, summer 21/01/05/09/13/17 UTC.
# GitHub may start scheduled runs late (often 5-20 min); every file carries its own timestamps.
name: Publish Capitalive brief
on:
  schedule:
    - cron: '7 1,2,5,6,9,10,13,14,17,18,21,22 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publish-brief
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - id: run
        run: node publish.mjs . || echo "failed=1" >> "$GITHUB_OUTPUT"
      - name: Commit snapshot (also a failed attempt, recorded in brief/status.json)
        run: |
          git config user.name "capitalive-brief-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add brief
          git diff --cached --quiet || git commit -m "brief $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
      - if: steps.run.outputs.failed == '1'
        run: exit 1
